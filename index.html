<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wallet Pro · Credit Card Rewards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #07090f;
        --bg-2: #111827;
        --bg-radial-a: #1b2b4a;
        --bg-radial-b: #2d193d;
        --glass: rgba(18, 25, 37, 0.62);
        --glass-border: rgba(255, 255, 255, 0.18);
        --text-main: #f6f7fb;
        --text-muted: rgba(225, 229, 240, 0.65);
        --accent: #ffffff;
        --accent-ink: #0a0f1d;
        --ring-a: #f59e0b;
        --ring-b: #38bdf8;
        --ring-c: #a78bfa;
        --panel-bg: rgba(12, 18, 29, 0.65);
        --panel-border: rgba(255, 255, 255, 0.09);
      }

      body.light {
        color-scheme: light;
        --bg-1: #edf2ff;
        --bg-2: #dbeafe;
        --bg-radial-a: #ffffff;
        --bg-radial-b: #dbe7ff;
        --glass: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.7);
        --text-main: #0f172a;
        --text-muted: rgba(51, 65, 85, 0.72);
        --accent: #0f172a;
        --accent-ink: #f8fafc;
        --panel-bg: rgba(255, 255, 255, 0.68);
        --panel-border: rgba(15, 23, 42, 0.1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "SF Pro Text", "SF Pro Display", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        background: radial-gradient(circle at 20% 10%, var(--bg-radial-a) 0%, transparent 35%),
          radial-gradient(circle at 88% 90%, var(--bg-radial-b) 0%, transparent 30%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
        display: flex;
        justify-content: center;
        transition: background 250ms ease, color 250ms ease;
      }

      .app-shell {
        width: min(1024px, 100%);
        padding: max(16px, env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom));
      }

      .top-glass,
      .bottom-glass,
      .add-card-panel {
        backdrop-filter: blur(24px) saturate(150%);
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
      }

      .top-glass {
        position: sticky;
        top: 10px;
        z-index: 10;
        padding: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .title-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .title { margin: 0 0 10px; font-size: clamp(1.1rem, 2vw, 1.65rem); font-weight: 700; letter-spacing: -0.02em; }

      .top-actions { display: flex; gap: 8px; }
      .pill-btn {
        border: 0;
        border-radius: 999px;
        padding: 9px 12px;
        font-weight: 700;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
      }

      .ghost-btn {
        background: rgba(255, 255, 255, 0.12);
        color: var(--text-main);
      }

      .search { display: flex; align-items: center; gap: 10px; border-radius: 18px; padding: 11px 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), inset 0 -4px 10px rgba(0, 0, 0, 0.1); }
      .search input,
      .add-card-panel input,
      .add-card-panel select {
        width: 100%; border: 0; outline: none; color: var(--text-main); background: transparent; font-size: 0.96rem;
      }

      .tabs { margin-top: 12px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.08); color: var(--text-main); padding: 8px 12px; border-radius: 999px; white-space: nowrap; font-weight: 600; cursor: pointer; }
      .tab.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

      .add-card-panel { margin-top: 10px; padding: 12px; display: none; }
      .add-card-panel.open { display: block; }
      .add-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; }
      .field { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px; padding: 8px 10px; }
      .issuer-chips { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
      .chip-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 999px; color: var(--text-main); font-weight: 600; padding: 6px 10px; cursor: pointer; }

      .cards-list { margin-top: 16px; display: grid; gap: 16px; }
      .card-panel { border-radius: 28px; padding: 14px; background: var(--panel-bg); border: 1px solid var(--panel-border); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2); }

      .credit-card {
        position: relative;
        border-radius: 31px;
        width: min(100%, 540px);
        aspect-ratio: 1.586;
        overflow: hidden;
        padding: clamp(12px, 2vw, 18px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 220ms cubic-bezier(0.2, 0.9, 0.2, 1);
        box-shadow: 0 20px 34px rgba(0, 0, 0, 0.35);
        isolation: isolate;
      }
      .credit-card:active { transform: scale(0.98); }
      .credit-card:hover { transform: translateY(-2px); }
      .credit-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(140deg, rgba(255, 255, 255, 0.25), transparent 32%, transparent 70%, rgba(255, 255, 255, 0.17)); pointer-events: none; }
      .amex-gold {
        background:
          radial-gradient(circle at 20% 18%, rgba(255, 232, 173, 0.35), transparent 38%),
          repeating-linear-gradient(102deg, rgba(126, 80, 16, 0.24) 0 2px, rgba(224, 183, 99, 0.23) 2px 4px),
          linear-gradient(132deg, #92631f 0%, #f2cc7b 34%, #a6702c 64%, #f8e3ac 100%);
      }
      .chase-csr {
        background:
          radial-gradient(circle at 82% 22%, rgba(173, 208, 255, 0.28), transparent 38%),
          repeating-linear-gradient(110deg, rgba(29, 48, 86, 0.34) 0 2px, rgba(52, 76, 130, 0.24) 2px 4px),
          linear-gradient(130deg, #0a1228 0%, #163f7f 42%, #0e1833 100%);
      }
      .amex-platinum {
        background:
          radial-gradient(circle at 22% 20%, rgba(255, 255, 255, 0.2), transparent 40%),
          repeating-linear-gradient(105deg, rgba(110, 122, 145, 0.2) 0 2px, rgba(225, 233, 250, 0.2) 2px 4px),
          linear-gradient(132deg, #7d889d 0%, #cdd8e9 36%, #8b97ac 100%);
      }
      .chase-ruby { background: linear-gradient(132deg, #440c1f 0%, #8e1538 43%, #3a0617 100%); }
      .chase-ink { background: linear-gradient(132deg, #041223, #0b2c50 46%, #051021); }
      .amex-blue { background: linear-gradient(132deg, #0d2f7d 0%, #2f73d6 50%, #0d295f 100%); }
      .discover-orange { background: linear-gradient(132deg, #141820 0%, #f97316 55%, #fbbf24 100%); }

      .brand-row,.card-number,.card-footer,.chip { position: relative; z-index: 1; color: #fff; }
      .brand-row { display: flex; justify-content: space-between; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
      .chip { width: 38px; height: 28px; border-radius: 7px; background: linear-gradient(120deg, #f4f4f5, #b9bec8 52%, #edeff4); }
      .card-number { margin: 0; letter-spacing: 0.12em; font-size: clamp(0.89rem, 2vw, 1.1rem); font-weight: 600; }
      .card-footer { display: flex; justify-content: space-between; font-size: 0.78rem; opacity: 0.95; }

      .headline { margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .headline h2 { margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.3rem); }
      .muted { color: var(--text-muted); font-size: 0.89rem; }
      .reward { margin: 2px 0 10px; font-size: clamp(1.5rem, 4vw, 1.9rem); font-weight: 800; letter-spacing: -0.02em; }

      .benefits { display: grid; gap: 10px; }
      .benefit-row { padding: 11px; border-radius: 16px; background: rgba(255, 255, 255, 0.06); }
      .benefit-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
      .benefit-name { font-weight: 600; }
      .progress { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(95deg, var(--ring-a), var(--ring-b), var(--ring-c)); }
      .rings { margin-top: 12px; display: flex; gap: 10px; }
      .ring { width: 76px; height: 76px; border-radius: 50%; display: grid; place-content: center; background: conic-gradient(var(--ring-a) calc(var(--p) * 1%), rgba(255, 255, 255, 0.1) 0); position: relative; }
      .ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: rgba(8, 12, 21, 0.9); }
      body.light .ring::before { background: rgba(255, 255, 255, 0.9); }
      .ring strong { position: relative; z-index: 1; font-size: 0.82rem; }

      .bottom-glass { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); width: min(560px, calc(100% - 24px)); padding: 10px; display: flex; justify-content: space-around; }
      .bottom-glass button { border: 0; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 0.86rem; }
      .bottom-glass button.active { color: var(--text-main); }

      @media (max-width: 768px) {
        .add-grid { grid-template-columns: 1fr; }
      }

      @media (min-width: 768px) and (max-width: 1100px) {
        .cards-list { grid-template-columns: 1fr 1fr; align-items: start; }
        .card-panel { min-height: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="top-glass">
        <div class="title-row">
          <h1 class="title">Wallet Pro · US Credit Rewards</h1>
          <div class="top-actions">
            <button class="pill-btn ghost-btn" id="toggleTheme">☀️ Light</button>
            <button class="pill-btn" id="toggleAddCard">+ Add My Card</button>
          </div>
        </div>

        <label class="search" for="searchInput">
          <span>🔍</span>
          <input id="searchInput" placeholder="Search merchants or categories (e.g. Uber, Flight)" />
        </label>
        <div class="tabs" id="tabs"></div>

        <div class="add-card-panel" id="addCardPanel">
          <div class="add-grid">
            <label class="field">
              <select id="issuerInput">
                <option value="amex">Amex</option>
                <option value="chase">Chase</option>
              </select>
            </label>
            <label class="field"><input id="cardNameInput" placeholder="Card name" /></label>
            <label class="field"><input type="number" min="1" id="pointsInput" placeholder="Top points" /></label>
            <button class="pill-btn" id="addCardBtn">Add</button>
          </div>
          <div class="issuer-chips">
            <button class="chip-btn" data-quick-add="amex">+ Quick Add Amex</button>
            <button class="chip-btn" data-quick-add="chase">+ Quick Add Chase</button>
          </div>
        </div>
      </section>

      <section class="cards-list" id="cardsList"></section>
    </main>

    <nav class="bottom-glass" aria-label="Main">
      <button class="active">My Wallet</button>
      <button>Explore</button>
      <button>Insights</button>
      <button>Profile</button>
    </nav>

    <script>
      const issuerPresets = {
        amex: {
          display: "Amex",
          themeClass: "amex-gold",
          defaultCard: "Amex Card",
          templateBenefits: [
            { name: "Dining Credit", total: 120, current: 10, type: "monthly", emoji: "🍽️" },
            { name: "Uber Cash", total: 120, current: 10, type: "monthly", emoji: "🚕" }
          ]
        },
        chase: {
          display: "Chase",
          themeClass: "chase-csr",
          defaultCard: "Chase Card",
          templateBenefits: [{ name: "Travel Credit", total: 300, current: 100, type: "annual", emoji: "✈️" }]
        }
      };

      const mockCards = [
        { id: "amex-gold", issuer: "amex", name: "Amex Gold", visual: "amex-gold", multipliers: { dining: 4, groceries: 4, flights: 3, default: 1 }, benefits: [{ name: "Uber Cash", total: 120, current: 10, type: "monthly", emoji: "🍔" }, { name: "Dining Credit", total: 120, current: 0, type: "monthly", emoji: "🍰" }] },
        { id: "chase-csr", issuer: "chase", name: "Chase Sapphire Reserve", visual: "chase-csr", multipliers: { travel: 3, dining: 3, default: 1 }, benefits: [{ name: "Annual Travel Credit", total: 300, current: 150, type: "annual", emoji: "✈️" }] },
        { id: "amex-platinum", issuer: "amex", name: "Amex Platinum", visual: "amex-platinum", multipliers: { flights: 5, hotels: 5, default: 1 }, benefits: [{ name: "Digital Entertainment", total: 240, current: 20, type: "monthly", emoji: "📺" }] },
        { id: "amex-bcp", issuer: "amex", name: "Amex Blue Cash Preferred", visual: "amex-blue", multipliers: { groceries: 6, streaming: 6, transit: 3, default: 1 }, benefits: [{ name: "Disney Bundle Credit", total: 84, current: 14, type: "monthly", emoji: "🎬" }] },
        { id: "amex-bce", issuer: "amex", name: "Amex Blue Cash Everyday", visual: "amex-blue", multipliers: { groceries: 3, gas: 3, online: 3, default: 1 }, benefits: [{ name: "Home Chef Credit", total: 180, current: 15, type: "monthly", emoji: "🏠" }] },
        { id: "amex-green", issuer: "amex", name: "Amex Green", visual: "amex-platinum", multipliers: { travel: 3, dining: 3, transit: 3, default: 1 }, benefits: [{ name: "CLEAR Plus", total: 189, current: 80, type: "annual", emoji: "🛂" }] },
        { id: "amex-everyday", issuer: "amex", name: "Amex EveryDay", visual: "amex-blue", multipliers: { groceries: 2, default: 1 }, benefits: [{ name: "Points Boost", total: 100, current: 20, type: "monthly", emoji: "⚡" }] },
        { id: "amex-everyday-pref", issuer: "amex", name: "Amex EveryDay Preferred", visual: "amex-blue", multipliers: { groceries: 3, gas: 2, default: 1 }, benefits: [{ name: "Bonus Points", total: 100, current: 25, type: "monthly", emoji: "🎯" }] },
        { id: "amex-delta-gold", issuer: "amex", name: "Delta SkyMiles Gold", visual: "amex-gold", multipliers: { flights: 2, dining: 2, groceries: 2, default: 1 }, benefits: [{ name: "Checked Bag", total: 60, current: 12, type: "monthly", emoji: "🧳" }] },
        { id: "amex-delta-plat", issuer: "amex", name: "Delta SkyMiles Platinum", visual: "amex-platinum", multipliers: { flights: 3, hotels: 3, default: 1 }, benefits: [{ name: "Companion Cert", total: 1, current: 0, type: "annual", emoji: "🎟️" }] },
        { id: "amex-delta-reserve", issuer: "amex", name: "Delta SkyMiles Reserve", visual: "amex-platinum", multipliers: { flights: 3, dining: 1, default: 1 }, benefits: [{ name: "Sky Club Visits", total: 15, current: 5, type: "annual", emoji: "🛋️" }] },
        { id: "amex-hilton-surpass", issuer: "amex", name: "Hilton Honors Surpass", visual: "amex-gold", multipliers: { hotels: 12, dining: 6, groceries: 6, default: 1 }, benefits: [{ name: "Hilton Credit", total: 200, current: 100, type: "annual", emoji: "🏨" }] },
        { id: "chase-sapphire-preferred", issuer: "chase", name: "Chase Sapphire Preferred", visual: "chase-ruby", multipliers: { travel: 2, dining: 3, online: 3, default: 1 }, benefits: [{ name: "Hotel Credit", total: 50, current: 20, type: "annual", emoji: "🛏️" }] },
        { id: "chase-freedom-unlimited", issuer: "chase", name: "Chase Freedom Unlimited", visual: "chase-csr", multipliers: { dining: 3, travel: 5, drugstore: 3, default: 1.5 }, benefits: [{ name: "DashPass", total: 120, current: 30, type: "annual", emoji: "🛵" }] },
        { id: "chase-freedom-flex", issuer: "chase", name: "Chase Freedom Flex", visual: "chase-csr", multipliers: { rotating: 5, travel: 5, dining: 3, default: 1 }, benefits: [{ name: "Lyft Promo", total: 60, current: 18, type: "annual", emoji: "🚲" }] },
        { id: "chase-amazon-prime", issuer: "chase", name: "Amazon Prime Visa", visual: "chase-ink", multipliers: { amazon: 5, dining: 2, gas: 2, default: 1 }, benefits: [{ name: "Prime Credits", total: 120, current: 40, type: "annual", emoji: "📦" }] },
        { id: "chase-united-explorer", issuer: "chase", name: "United Explorer", visual: "chase-csr", multipliers: { flights: 2, hotels: 2, dining: 2, default: 1 }, benefits: [{ name: "Global Entry", total: 100, current: 0, type: "4y", emoji: "🌍" }] },
        { id: "chase-united-quest", issuer: "chase", name: "United Quest", visual: "chase-ruby", multipliers: { flights: 3, travel: 2, dining: 2, default: 1 }, benefits: [{ name: "United Credit", total: 200, current: 100, type: "annual", emoji: "🛫" }] },
        { id: "chase-united-club", issuer: "chase", name: "United Club Infinite", visual: "chase-ink", multipliers: { flights: 4, default: 1 }, benefits: [{ name: "Club Membership", total: 1, current: 1, type: "annual", emoji: "🏢" }] },
        { id: "chase-ihg-premier", issuer: "chase", name: "IHG Premier", visual: "chase-csr", multipliers: { hotels: 10, gas: 5, dining: 5, default: 1 }, benefits: [{ name: "Anniversary Night", total: 1, current: 0, type: "annual", emoji: "🌙" }] },
        { id: "chase-southwest-plus", issuer: "chase", name: "Southwest Plus", visual: "chase-ruby", multipliers: { flights: 2, transit: 2, internet: 2, default: 1 }, benefits: [{ name: "EarlyBird Check-In", total: 2, current: 1, type: "annual", emoji: "🐦" }] },
        { id: "chase-ink-preferred", issuer: "chase", name: "Ink Business Preferred", visual: "chase-ink", multipliers: { travel: 3, shipping: 3, ads: 3, default: 1 }, benefits: [{ name: "Cell Phone Protection", total: 600, current: 0, type: "claim", emoji: "📱" }] },
        { id: "chase-ink-cash", issuer: "chase", name: "Ink Business Cash", visual: "chase-csr", multipliers: { office: 5, internet: 5, gas: 2, default: 1 }, benefits: [{ name: "Intro APR", total: 12, current: 6, type: "months", emoji: "💼" }] }
      ];

      const tabs = [
        { id: "dining", label: "🍽️ Dining" },
        { id: "travel", label: "✈️ Travel" },
        { id: "groceries", label: "🛒 Groceries" },
        { id: "gas", label: "⛽ Gas" },
        { id: "all", label: "🛍️ All" }
      ];

      let activeTab = "all";
      let query = "";

      const tabsEl = document.getElementById("tabs");
      const cardsEl = document.getElementById("cardsList");
      const searchEl = document.getElementById("searchInput");
      const addPanelEl = document.getElementById("addCardPanel");
      const toggleAddCardEl = document.getElementById("toggleAddCard");
      const toggleThemeEl = document.getElementById("toggleTheme");
      const addCardBtnEl = document.getElementById("addCardBtn");
      const issuerInputEl = document.getElementById("issuerInput");
      const cardNameInputEl = document.getElementById("cardNameInput");
      const pointsInputEl = document.getElementById("pointsInput");

      function animateNumber(el, to, prefix = "", suffix = "") {
        const from = Number(el.dataset.value || 0);
        const duration = 400;
        const start = performance.now();
        function tick(now) {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          const value = Math.round(from + (to - from) * eased);
          el.textContent = `${prefix}${value}${suffix}`;
          if (p < 1) requestAnimationFrame(tick);
          else el.dataset.value = String(to);
        }
        requestAnimationFrame(tick);
      }

      function matchesCard(card) {
        const q = query.toLowerCase().trim();
        const bonusKeys = Object.keys(card.multipliers);
        const tabMatch = activeTab === "all" || bonusKeys.includes(activeTab) || (activeTab === "travel" && bonusKeys.includes("flights"));
        if (!q) return tabMatch;
        const hay = `${card.name} ${card.issuer} ${bonusKeys.join(" ")} ${card.benefits.map((b) => b.name).join(" ")}`.toLowerCase();
        return tabMatch && hay.includes(q);
      }

      function topMultiplier(card) {
        const entries = Object.entries(card.multipliers).filter(([k]) => k !== "default");
        const [category, points] = entries.sort((a, b) => b[1] - a[1])[0] || ["default", 1];
        return { category, points };
      }

      function renderTabs() {
        tabsEl.innerHTML = "";
        tabs.forEach((tab) => {
          const button = document.createElement("button");
          button.className = `tab ${activeTab === tab.id ? "active" : ""}`;
          button.textContent = tab.label;
          button.onclick = () => {
            activeTab = tab.id;
            renderTabs();
            renderCards();
          };
          tabsEl.appendChild(button);
        });
      }

      function createCardFromIssuer(issuerKey, customName, customPoints) {
        const preset = issuerPresets[issuerKey];
        const points = Math.max(1, Number(customPoints) || 2);
        return {
          id: `${issuerKey}-${Date.now()}`,
          issuer: issuerKey,
          name: customName?.trim() || preset.defaultCard,
          visual: preset.themeClass,
          multipliers: { dining: points, travel: points, default: 1 },
          benefits: preset.templateBenefits.map((b) => ({ ...b }))
        };
      }

      function renderCards() {
        cardsEl.innerHTML = "";
        const list = mockCards.filter(matchesCard);
        if (!list.length) {
          cardsEl.innerHTML = `<div class="card-panel"><p class="muted">No cards found for “${query}”. Try Uber or Flight.</p></div>`;
          return;
        }

        list.forEach((card, index) => {
          const { points, category } = topMultiplier(card);
          const panel = document.createElement("article");
          panel.className = "card-panel";
          panel.style.transform = `translateY(${index * -1}px)`;
          panel.innerHTML = `
            <div class="credit-card ${card.visual}">
              <div class="brand-row"><span>${card.name}</span><span>${issuerPresets[card.issuer]?.display || "Card"}</span></div>
              <div class="chip"></div>
              <p class="card-number">•••• •••• •••• ${String(9000 + index * 41).slice(-4)}</p>
              <div class="card-footer"><span>VALID THRU 12/30</span><span>WALLET PRO</span></div>
            </div>
            <div class="headline"><h2>${card.name}</h2><span class="muted">Best for ${category}</span></div>
            <div class="reward">🏆 <span class="ticker" data-value="0">0</span>X Points</div>
            <div class="benefits"></div>
            <div class="rings"></div>
          `;
          cardsEl.appendChild(panel);
          animateNumber(panel.querySelector(".ticker"), points);

          const benefitsEl = panel.querySelector(".benefits");
          const ringsEl = panel.querySelector(".rings");
          card.benefits.forEach((benefit, idx) => {
            const pct = Math.min(100, Math.round((benefit.current / benefit.total) * 100));
            const row = document.createElement("div");
            row.className = "benefit-row";
            row.innerHTML = `
              <div class="benefit-top">
                <span class="benefit-name">${benefit.emoji} ${benefit.name} (${benefit.type})</span>
                <span class="muted"><span class="ticker-cash" data-value="0">$0</span> / $${benefit.total}</span>
              </div>
              <div class="progress"><span style="width:${pct}%"></span></div>`;
            benefitsEl.appendChild(row);
            animateNumber(row.querySelector(".ticker-cash"), benefit.current, "$", "");
            if (idx < 2) {
              const ring = document.createElement("div");
              ring.className = "ring";
              ring.style.setProperty("--p", pct);
              ring.innerHTML = `<strong>${pct}%</strong>`;
              ringsEl.appendChild(ring);
            }
          });
        });
      }

      toggleThemeEl.addEventListener("click", () => {
        document.body.classList.toggle("light");
        const light = document.body.classList.contains("light");
        toggleThemeEl.textContent = light ? "🌙 Dark" : "☀️ Light";
      });

      toggleAddCardEl.addEventListener("click", () => addPanelEl.classList.toggle("open"));

      addCardBtnEl.addEventListener("click", () => {
        mockCards.unshift(createCardFromIssuer(issuerInputEl.value, cardNameInputEl.value, pointsInputEl.value));
        cardNameInputEl.value = "";
        pointsInputEl.value = "";
        renderCards();
      });

      document.querySelectorAll("[data-quick-add]").forEach((btn) => {
        btn.addEventListener("click", () => {
          mockCards.unshift(createCardFromIssuer(btn.getAttribute("data-quick-add")));
          renderCards();
        });
      });

      searchEl.addEventListener("input", (event) => {
        query = event.target.value;
        renderCards();
      });

      renderTabs();
      renderCards();
    </script>
  </body>
</html>
