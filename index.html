<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Pro · Credit Card Rewards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #07090f;
        --bg-2: #101725;
        --glass: rgba(18, 25, 37, 0.62);
        --glass-border: rgba(255, 255, 255, 0.18);
        --text-main: #f6f7fb;
        --text-muted: rgba(225, 229, 240, 0.65);
        --accent: #ffffff;
        --accent-ink: #0a0f1d;
        --ring-a: #f59e0b;
        --ring-b: #38bdf8;
        --ring-c: #a78bfa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "SF Pro Text", "SF Pro Display", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        background: radial-gradient(circle at 20% 10%, #1b2b4a 0%, transparent 35%),
          radial-gradient(circle at 88% 90%, #2d193d 0%, transparent 30%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
        display: flex;
        justify-content: center;
      }

      .app-shell {
        width: min(980px, 100%);
        padding: 24px 16px 96px;
      }

      .top-glass,
      .bottom-glass,
      .add-card-panel {
        backdrop-filter: blur(24px) saturate(150%);
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
      }

      .top-glass {
        position: sticky;
        top: 14px;
        z-index: 10;
        padding: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .title {
        margin: 0 0 12px;
        font-size: clamp(1.3rem, 2vw, 1.8rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .add-btn {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 700;
        background: #fff;
        color: #07090f;
        cursor: pointer;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 18px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), inset 0 -4px 10px rgba(0, 0, 0, 0.16);
      }

      .search input,
      .add-card-panel input,
      .add-card-panel select {
        width: 100%;
        border: 0;
        outline: none;
        color: var(--text-main);
        background: transparent;
        font-size: 0.98rem;
      }

      .tabs { margin-top: 14px; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.06); color: var(--text-main); padding: 8px 14px; border-radius: 999px; white-space: nowrap; font-weight: 600; cursor: pointer; transition: all 180ms ease; }
      .tab.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

      .add-card-panel {
        margin-top: 12px;
        padding: 14px;
        display: none;
      }
      .add-card-panel.open { display: block; }

      .add-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 10px;
      }

      .field {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        padding: 9px 10px;
      }

      .issuer-chips {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip-btn {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        color: var(--text-main);
        font-weight: 600;
        padding: 6px 10px;
        cursor: pointer;
      }

      .cards-list { margin-top: 22px; display: grid; gap: 20px; }

      .card-panel {
        border-radius: 30px;
        padding: 16px;
        background: rgba(12, 18, 29, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 35px 80px rgba(0, 0, 0, 0.45), 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .credit-card {
        position: relative;
        border-radius: 32px;
        width: min(100%, 500px);
        aspect-ratio: 1.586;
        overflow: hidden;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transform-style: preserve-3d;
        transition: transform 220ms cubic-bezier(0.2, 0.9, 0.2, 1), box-shadow 220ms;
        box-shadow: 0 24px 40px rgba(0, 0, 0, 0.45);
        background-size: cover;
        background-position: center;
      }

      .credit-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.35;
        mix-blend-mode: soft-light;
      }

      .credit-card:active { transform: scale(0.98); }
      .credit-card:hover { transform: translateY(-3px); }
      .credit-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(130deg, rgba(255, 255, 255, 0.3), transparent 35%, transparent 68%, rgba(255, 255, 255, 0.24)); pointer-events: none; }

      .brand-row,.card-number,.card-footer { position: relative; z-index: 2; }
      .brand-row { display: flex; justify-content: space-between; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; color: rgba(255, 255, 255, 0.92); }
      .chip { width: 42px; height: 30px; border-radius: 8px; background: linear-gradient(125deg, #e5e7eb, #b8beca 45%, #f8fafc); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45); position: relative; z-index: 2; }
      .card-number { margin: 0; letter-spacing: 0.12em; font-size: 1.12rem; font-weight: 600; color: rgba(255, 255, 255, 0.94); }
      .card-footer { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.88); font-size: 0.88rem; }

      .headline { margin: 14px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .headline h2 { margin: 0; font-size: 1.35rem; }
      .muted { color: var(--text-muted); font-size: 0.92rem; }
      .reward { margin: 4px 0 14px; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
      .benefits { display: grid; gap: 12px; }
      .benefit-row { padding: 12px; border-radius: 18px; background: rgba(255, 255, 255, 0.05); }
      .benefit-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .benefit-name { font-weight: 600; }
      .progress { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(95deg, var(--ring-a), var(--ring-b), var(--ring-c)); width: 0; transition: width 500ms cubic-bezier(0.2, 1, 0.2, 1); }
      .rings { margin-top: 16px; display: flex; gap: 14px; }
      .ring { width: 88px; height: 88px; border-radius: 50%; display: grid; place-content: center; background: conic-gradient(var(--ring-a) calc(var(--p) * 1%), rgba(255, 255, 255, 0.07) 0); position: relative; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
      .ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: rgba(8, 12, 21, 0.95); }
      .ring strong { position: relative; z-index: 1; font-size: 0.86rem; }

      .bottom-glass { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; width: min(540px, calc(100% - 28px)); padding: 12px; display: flex; justify-content: space-around; }
      .bottom-glass button { border: 0; background: transparent; color: var(--text-muted); font-weight: 600; }
      .bottom-glass button.active { color: var(--text-main); }

      @media (max-width: 760px) {
        .add-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 640px) {
        .reward { font-size: 1.7rem; }
        .credit-card { border-radius: 28px; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="top-glass">
        <div class="title-row">
          <h1 class="title">Wallet Pro · US Credit Rewards</h1>
          <button class="add-btn" id="toggleAddCard">+ Add My Card</button>
        </div>

        <label class="search" for="searchInput">
          <span>🔍</span>
          <input id="searchInput" placeholder="Search merchants or categories (e.g. Uber, Flight)" />
        </label>
        <div class="tabs" id="tabs"></div>

        <div class="add-card-panel" id="addCardPanel">
          <div class="add-grid">
            <label class="field">
              <select id="issuerInput">
                <option value="amex">Amex</option>
                <option value="chase">Chase</option>
                <option value="citi">Citi</option>
                <option value="discover">Discover</option>
              </select>
            </label>
            <label class="field"><input id="cardNameInput" placeholder="Card name (e.g. Blue Cash Everyday)" /></label>
            <label class="field"><input type="number" min="1" id="pointsInput" placeholder="Top points (e.g. 3)" /></label>
            <button class="add-btn" id="addCardBtn">Add</button>
          </div>
          <div class="issuer-chips">
            <button class="chip-btn" data-quick-add="amex">+ Quick Add Amex</button>
            <button class="chip-btn" data-quick-add="chase">+ Quick Add Chase</button>
            <button class="chip-btn" data-quick-add="citi">+ Quick Add Citi</button>
            <button class="chip-btn" data-quick-add="discover">+ Quick Add Discover</button>
          </div>
        </div>
      </section>

      <section class="cards-list" id="cardsList"></section>
    </main>

    <nav class="bottom-glass" aria-label="Main">
      <button class="active">My Wallet</button>
      <button>Explore</button>
      <button>Insights</button>
      <button>Profile</button>
    </nav>

    <script>
      const issuerPresets = {
        amex: {
          display: "Amex",
          imageUrl: "https://images.unsplash.com/photo-1618005198919-d3d4b5a92eee?auto=format&fit=crop&w=1200&q=80",
          gradient: "linear-gradient(135deg, #b8802f 5%, #f4d07f 45%, #8a5b23 100%)",
          defaultCard: "Amex Member Card"
        },
        chase: {
          display: "Chase",
          imageUrl: "https://images.unsplash.com/photo-1614850523011-8f49ffc73908?auto=format&fit=crop&w=1200&q=80",
          gradient: "linear-gradient(130deg, #0f1a33 0%, #334b7f 38%, #111c38 100%)",
          defaultCard: "Chase Card"
        },
        citi: {
          display: "Citi",
          imageUrl: "https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1200&q=80",
          gradient: "linear-gradient(130deg, #182a5a, #1f5db6 42%, #19326a)",
          defaultCard: "Citi Card"
        },
        discover: {
          display: "Discover",
          imageUrl: "https://images.unsplash.com/photo-1633158829875-e5316a358c6f?auto=format&fit=crop&w=1200&q=80",
          gradient: "linear-gradient(130deg, #111827 8%, #f97316 52%, #f59e0b 100%)",
          defaultCard: "Discover Card"
        }
      };

      const mockCards = [
        {
          id: "amex-gold",
          issuer: "amex",
          name: "Amex Gold",
          imageUrl: issuerPresets.amex.imageUrl,
          multipliers: { dining: 4, groceries: 4, flights: 3, default: 1 },
          benefits: [
            { name: "Uber Cash", total: 120, current: 10, type: "monthly", periodValue: 10, emoji: "🍔" },
            { name: "Dining Credit", total: 120, current: 0, type: "monthly", periodValue: 10, emoji: "🍰" }
          ],
          styles: { gradient: issuerPresets.amex.gradient }
        },
        {
          id: "chase-csr",
          issuer: "chase",
          name: "Chase Sapphire Reserve",
          imageUrl: issuerPresets.chase.imageUrl,
          multipliers: { travel: 3, dining: 3, default: 1 },
          benefits: [{ name: "Annual Travel Credit", total: 300, current: 150, type: "annual", periodValue: 300, emoji: "✈️" }],
          styles: { gradient: issuerPresets.chase.gradient }
        },
        {
          id: "amex-platinum",
          issuer: "amex",
          name: "Amex Platinum",
          imageUrl: "https://images.unsplash.com/photo-1614036634955-ae5e90f9b9eb?auto=format&fit=crop&w=1200&q=80",
          multipliers: { flights: 5, hotels: 5, default: 1 },
          benefits: [
            { name: "Digital Entertainment Credit", total: 240, current: 20, type: "monthly", periodValue: 20, emoji: "📺" },
            { name: "Airline Fee Credit", total: 200, current: 75, type: "annual", periodValue: 200, emoji: "✈️" }
          ],
          styles: { gradient: "linear-gradient(140deg, #6f7d9b 0%, #c7d2e5 35%, #7f8ca7 100%)" }
        }
      ];

      const tabs = [
        { id: "dining", label: "🍽️ Dining" },
        { id: "travel", label: "✈️ Travel" },
        { id: "groceries", label: "🛒 Groceries" },
        { id: "gas", label: "⛽ Gas" },
        { id: "all", label: "🛍️ All" }
      ];

      let activeTab = "all";
      let query = "";

      const tabsEl = document.getElementById("tabs");
      const cardsEl = document.getElementById("cardsList");
      const searchEl = document.getElementById("searchInput");
      const addPanelEl = document.getElementById("addCardPanel");
      const toggleAddCardEl = document.getElementById("toggleAddCard");
      const addCardBtnEl = document.getElementById("addCardBtn");
      const issuerInputEl = document.getElementById("issuerInput");
      const cardNameInputEl = document.getElementById("cardNameInput");
      const pointsInputEl = document.getElementById("pointsInput");

      function animateNumber(el, to, prefix = "", suffix = "") {
        const from = Number(el.dataset.value || 0);
        const duration = 420;
        const start = performance.now();
        function tick(now) {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          const value = Math.round(from + (to - from) * eased);
          el.textContent = `${prefix}${value}${suffix}`;
          if (p < 1) requestAnimationFrame(tick);
          else el.dataset.value = String(to);
        }
        requestAnimationFrame(tick);
      }

      function matchesCard(card) {
        const q = query.toLowerCase().trim();
        const bonusKeys = Object.keys(card.multipliers);
        const tabMatch = activeTab === "all" || bonusKeys.includes(activeTab) || (activeTab === "travel" && bonusKeys.includes("flights"));
        if (!q) return tabMatch;
        const text = `${card.name} ${card.issuer} ${bonusKeys.join(" ")} ${card.benefits.map((b) => b.name).join(" ")}`.toLowerCase();
        return tabMatch && text.includes(q);
      }

      function topMultiplier(card) {
        const entries = Object.entries(card.multipliers).filter(([k]) => k !== "default");
        const [category, points] = entries.sort((a, b) => b[1] - a[1])[0] || ["default", 1];
        return { category, points };
      }

      function renderTabs() {
        tabsEl.innerHTML = "";
        tabs.forEach((tab) => {
          const button = document.createElement("button");
          button.className = `tab ${activeTab === tab.id ? "active" : ""}`;
          button.textContent = tab.label;
          button.onclick = () => {
            activeTab = tab.id;
            renderTabs();
            renderCards();
          };
          tabsEl.appendChild(button);
        });
      }

      function createCardFromIssuer(issuerKey, customName, customPoints) {
        const preset = issuerPresets[issuerKey];
        const points = Math.max(1, Number(customPoints) || 2);
        const cardName = customName?.trim() || preset.defaultCard;
        return {
          id: `${issuerKey}-${Date.now()}-${Math.floor(Math.random() * 999)}`,
          issuer: issuerKey,
          name: cardName,
          imageUrl: preset.imageUrl,
          multipliers: { dining: points, travel: points, default: 1 },
          benefits: [{ name: "Welcome Credit", total: 100, current: 0, type: "monthly", periodValue: 10, emoji: "🎁" }],
          styles: { gradient: preset.gradient }
        };
      }

      function renderCards() {
        cardsEl.innerHTML = "";
        const list = mockCards.filter(matchesCard);

        if (!list.length) {
          cardsEl.innerHTML = `<div class="card-panel"><p class="muted">No cards found for “${query}”. Try \"Uber\" or \"Flight\".</p></div>`;
          return;
        }

        list.forEach((card, index) => {
          const { points, category } = topMultiplier(card);
          const panel = document.createElement("article");
          panel.className = "card-panel";
          panel.style.transform = `translateY(${index * -2}px)`;

          panel.innerHTML = `
            <div class="credit-card" style="background-image: ${card.styles.gradient};">
              <img src="${card.imageUrl}" alt="${card.name} card texture" loading="lazy" />
              <div class="brand-row"><span>${card.name}</span><span>${issuerPresets[card.issuer]?.display || "Card"}</span></div>
              <div class="chip"></div>
              <p class="card-number">•••• •••• •••• ${String(9000 + index * 37).slice(-4)}</p>
              <div class="card-footer"><span>VALID THRU 12/30</span><span>WALLET PRO</span></div>
            </div>
            <div class="headline">
              <h2>${card.name}</h2>
              <span class="muted">Best for ${category}</span>
            </div>
            <div class="reward">🏆 <span class="ticker" data-value="0">0</span>X Points</div>
            <div class="benefits"></div>
            <div class="rings"></div>
          `;

          cardsEl.appendChild(panel);
          animateNumber(panel.querySelector(".ticker"), points);

          const benefitsEl = panel.querySelector(".benefits");
          const ringsEl = panel.querySelector(".rings");

          card.benefits.forEach((benefit, idx) => {
            const pct = Math.min(100, Math.round((benefit.current / benefit.total) * 100));
            const row = document.createElement("div");
            row.className = "benefit-row";
            row.innerHTML = `
              <div class="benefit-top">
                <span class="benefit-name">${benefit.emoji} ${benefit.name} (${benefit.type})</span>
                <span class="muted"><span class="ticker-cash" data-value="0">$0</span> / $${benefit.total}</span>
              </div>
              <div class="progress"><span style="width:${pct}%"></span></div>
            `;
            benefitsEl.appendChild(row);
            animateNumber(row.querySelector(".ticker-cash"), benefit.current, "$", "");

            if (idx < 2) {
              const ring = document.createElement("div");
              ring.className = "ring";
              ring.style.setProperty("--p", pct);
              ring.innerHTML = `<strong>${pct}%</strong>`;
              ringsEl.appendChild(ring);
            }
          });
        });
      }

      toggleAddCardEl.addEventListener("click", () => {
        addPanelEl.classList.toggle("open");
      });

      addCardBtnEl.addEventListener("click", () => {
        const card = createCardFromIssuer(issuerInputEl.value, cardNameInputEl.value, pointsInputEl.value);
        mockCards.unshift(card);
        cardNameInputEl.value = "";
        pointsInputEl.value = "";
        renderCards();
      });

      document.querySelectorAll("[data-quick-add]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const issuer = btn.getAttribute("data-quick-add");
          mockCards.unshift(createCardFromIssuer(issuer));
          renderCards();
        });
      });

      searchEl.addEventListener("input", (event) => {
        query = event.target.value;
        renderCards();
      });

      renderTabs();
      renderCards();
    </script>
  </body>
</html>
